name: Release Build

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: converter-app.exe
            archive_name: file-converter-windows-x86_64.zip

          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: converter-app
            archive_name: file-converter-macos-arm64.tar.gz

          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: converter-app
            archive_name: file-converter-linux-x86_64.tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev libx11-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build Release Binary
        run: cargo build --release --bin converter-app --target ${{ matrix.target }}

      - name: Bundle FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "Downloading prebuilt static FFmpeg for Windows..."
          $ffmpegUrl = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          $ffmpegAttempts = 5
          for ($ffmpegTry = 0; $ffmpegTry -lt $ffmpegAttempts; $ffmpegTry++) {
            try {
              Invoke-WebRequest -Uri $ffmpegUrl -OutFile "ffmpeg.zip" -UseBasicParsing
              break
            } catch {
              if ($ffmpegTry -eq ($ffmpegAttempts - 1)) { throw }
              Write-Host "FFmpeg download failed, retrying ($($ffmpegTry + 1)/$ffmpegAttempts)..."
              Start-Sleep -Seconds 10
            }
          }
          if (-not (Test-Path "ffmpeg.zip") -or (Get-Item "ffmpeg.zip").Length -lt 10000000) {
            throw "FFmpeg archive is missing or suspiciously small"
          }
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg-extracted"
          $ffmpegExe = Get-ChildItem -Path "ffmpeg-extracted" -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          $ffprobeExe = Get-ChildItem -Path "ffmpeg-extracted" -Recurse -Filter "ffprobe.exe" | Select-Object -First 1
          Copy-Item $ffmpegExe.FullName -Destination "target/${{ matrix.target }}/release/ffmpeg.exe"
          Copy-Item $ffprobeExe.FullName -Destination "target/${{ matrix.target }}/release/ffprobe.exe"
          Write-Host "Downloading yt-dlp for Windows..."
          $ytdlpUrl = "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe"
          $ytdlpAttempts = 5
          for ($ytdlpTry = 0; $ytdlpTry -lt $ytdlpAttempts; $ytdlpTry++) {
            try {
              Invoke-WebRequest -Uri $ytdlpUrl -OutFile "target/${{ matrix.target }}/release/yt-dlp.exe" -UseBasicParsing
              break
            } catch {
              if ($ytdlpTry -eq ($ytdlpAttempts - 1)) { throw }
              Write-Host "yt-dlp download failed, retrying ($($ytdlpTry + 1)/$ytdlpAttempts)..."
              Start-Sleep -Seconds 10
            }
          }
          if (-not (Test-Path "target/${{ matrix.target }}/release/yt-dlp.exe") -or (Get-Item "target/${{ matrix.target }}/release/yt-dlp.exe").Length -lt 1000000) {
            Write-Host "yt-dlp binary missing/small, retrying download..."
            for ($ytdlpTry = 0; $ytdlpTry -lt $ytdlpAttempts; $ytdlpTry++) {
              try {
                Invoke-WebRequest -Uri $ytdlpUrl -OutFile "target/${{ matrix.target }}/release/yt-dlp.exe" -UseBasicParsing
                break
              } catch {
                if ($ytdlpTry -eq ($ytdlpAttempts - 1)) { throw }
                Write-Host "yt-dlp retry failed, retrying ($($ytdlpTry + 1)/$ytdlpAttempts)..."
                Start-Sleep -Seconds 10
              }
            }
          }
          if (-not (Test-Path "target/${{ matrix.target }}/release/yt-dlp.exe") -or (Get-Item "target/${{ matrix.target }}/release/yt-dlp.exe").Length -lt 1000000) {
            throw "yt-dlp binary is missing or suspiciously small after retry"
          }
          Compress-Archive -Path "target/${{ matrix.target }}/release/converter-app.exe", "target/${{ matrix.target }}/release/ffmpeg.exe", "target/${{ matrix.target }}/release/ffprobe.exe", "target/${{ matrix.target }}/release/yt-dlp.exe" -DestinationPath "${{ matrix.archive_name }}"

      - name: Bundle FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "Downloading prebuilt static FFmpeg for Linux..."
          curl -fL --retry 5 --retry-delay 10 --retry-all-errors -o ffmpeg.tar.xz "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz"
          if [ ! -s ffmpeg.tar.xz ] || [ "$(stat -c%s ffmpeg.tar.xz 2>/dev/null || stat -f%z ffmpeg.tar.xz)" -lt 10000000 ]; then
            echo "FFmpeg archive is missing or suspiciously small" >&2
            exit 1
          fi
          mkdir -p ffmpeg-extracted
          tar -xf ffmpeg.tar.xz -C ffmpeg-extracted --strip-components=1
          cp ffmpeg-extracted/bin/ffmpeg target/${{ matrix.target }}/release/
          cp ffmpeg-extracted/bin/ffprobe target/${{ matrix.target }}/release/
          echo "Downloading yt-dlp for Linux..."
          curl -fL --retry 5 --retry-delay 10 --retry-all-errors -o "target/${{ matrix.target }}/release/yt-dlp" "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux"
          if [ ! -s "target/${{ matrix.target }}/release/yt-dlp" ] || [ "$(stat -c%s "target/${{ matrix.target }}/release/yt-dlp" 2>/dev/null || stat -f%z "target/${{ matrix.target }}/release/yt-dlp")" -lt 1000000 ]; then
            echo "yt-dlp binary is missing or suspiciously small, retrying download..." >&2
            curl -fL --retry 5 --retry-delay 10 --retry-all-errors -o "target/${{ matrix.target }}/release/yt-dlp" "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux"
          fi
          if [ ! -s "target/${{ matrix.target }}/release/yt-dlp" ] || [ "$(stat -c%s "target/${{ matrix.target }}/release/yt-dlp" 2>/dev/null || stat -f%z "target/${{ matrix.target }}/release/yt-dlp")" -lt 1000000 ]; then
            echo "yt-dlp binary is missing or suspiciously small after retry" >&2
            exit 1
          fi
          chmod +x target/${{ matrix.target }}/release/ffmpeg target/${{ matrix.target }}/release/ffprobe target/${{ matrix.target }}/release/yt-dlp
          tar -czvf "${{ matrix.archive_name }}" -C "target/${{ matrix.target }}/release" converter-app ffmpeg ffprobe yt-dlp

      - name: Bundle FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: |
          echo "Installing and bundling FFmpeg for macOS..."
          brew install ffmpeg
          cp $(which ffmpeg) target/${{ matrix.target }}/release/
          cp $(which ffprobe) target/${{ matrix.target }}/release/
          echo "Downloading yt-dlp for macOS..."
          curl -fL --retry 5 --retry-delay 10 --retry-all-errors -o "target/${{ matrix.target }}/release/yt-dlp" "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_macos_arm64"
          if [ ! -s "target/${{ matrix.target }}/release/yt-dlp" ] || [ "$(stat -c%s "target/${{ matrix.target }}/release/yt-dlp" 2>/dev/null || stat -f%z "target/${{ matrix.target }}/release/yt-dlp")" -lt 1000000 ]; then
            echo "yt-dlp binary is missing or suspiciously small, retrying download..." >&2
            curl -fL --retry 5 --retry-delay 10 --retry-all-errors -o "target/${{ matrix.target }}/release/yt-dlp" "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_macos_arm64"
          fi
          if [ ! -s "target/${{ matrix.target }}/release/yt-dlp" ] || [ "$(stat -c%s "target/${{ matrix.target }}/release/yt-dlp" 2>/dev/null || stat -f%z "target/${{ matrix.target }}/release/yt-dlp")" -lt 1000000 ]; then
            echo "yt-dlp binary is missing or suspiciously small after retry" >&2
            exit 1
          fi
          chmod +x target/${{ matrix.target }}/release/yt-dlp target/${{ matrix.target }}/release/ffmpeg target/${{ matrix.target }}/release/ffprobe
          tar -czvf "${{ matrix.archive_name }}" -C "target/${{ matrix.target }}/release" converter-app ffmpeg ffprobe yt-dlp

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive_name }}
          path: ${{ matrix.archive_name }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('nightly-{0}', github.sha) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('Nightly Build ({0})', github.sha) }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

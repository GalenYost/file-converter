name: Release Build

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: converter-app.exe
            archive_name: file-converter-windows-x86_64.zip

          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: converter-app
            archive_name: file-converter-macos-arm64.tar.gz

          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: converter-app
            archive_name: file-converter-linux-x86_64.tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev libx11-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build Release Binary
        run: cargo build --release --bin converter-app --target ${{ matrix.target }}

      - name: Bundle FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "Downloading prebuilt static FFmpeg for Windows..."
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile "ffmpeg.zip"
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg-extracted"
          $ffmpegExe = Get-ChildItem -Path "ffmpeg-extracted" -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          $ffprobeExe = Get-ChildItem -Path "ffmpeg-extracted" -Recurse -Filter "ffprobe.exe" | Select-Object -First 1
          Copy-Item $ffmpegExe.FullName -Destination "target/${{ matrix.target }}/release/ffmpeg.exe"
          Copy-Item $ffprobeExe.FullName -Destination "target/${{ matrix.target }}/release/ffprobe.exe"
          Write-Host "Downloading yt-dlp for Windows..."
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile "target/${{ matrix.target }}/release/yt-dlp.exe"
          Compress-Archive -Path "target/${{ matrix.target }}/release/converter-app.exe", "target/${{ matrix.target }}/release/ffmpeg.exe", "target/${{ matrix.target }}/release/ffprobe.exe", "target/${{ matrix.target }}/release/yt-dlp.exe" -DestinationPath "${{ matrix.archive_name }}"

      - name: Bundle FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "Downloading prebuilt static FFmpeg for Linux..."
          curl -L -o ffmpeg.tar.xz "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz"
          mkdir -p ffmpeg-extracted
          tar -xf ffmpeg.tar.xz -C ffmpeg-extracted --strip-components=1
          cp ffmpeg-extracted/bin/ffmpeg target/${{ matrix.target }}/release/
          cp ffmpeg-extracted/bin/ffprobe target/${{ matrix.target }}/release/
          echo "Downloading yt-dlp for Linux..."
          curl -L -o "target/${{ matrix.target }}/release/yt-dlp" "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux"
          chmod +x target/${{ matrix.target }}/release/ffmpeg target/${{ matrix.target }}/release/ffprobe target/${{ matrix.target }}/release/yt-dlp
          tar -czvf "${{ matrix.archive_name }}" -C "target/${{ matrix.target }}/release" converter-app ffmpeg ffprobe yt-dlp

      - name: Bundle FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: |
          echo "Installing and bundling FFmpeg for macOS..."
          brew install ffmpeg
          cp $(which ffmpeg) target/${{ matrix.target }}/release/
          cp $(which ffprobe) target/${{ matrix.target }}/release/
          echo "Downloading yt-dlp for macOS..."
          curl -L -o "target/${{ matrix.target }}/release/yt-dlp" "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_macos_arm64"
          chmod +x target/${{ matrix.target }}/release/yt-dlp target/${{ matrix.target }}/release/ffmpeg target/${{ matrix.target }}/release/ffprobe
          tar -czvf "${{ matrix.archive_name }}" -C "target/${{ matrix.target }}/release" converter-app ffmpeg ffprobe yt-dlp

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive_name }}
          path: ${{ matrix.archive_name }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('nightly-{0}', github.sha) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('Nightly Build ({0})', github.sha) }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

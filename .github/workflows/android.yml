name: Android APK

on:
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
      - '.github/workflows/release.yml'
  workflow_call:
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_STORE_PASSWORD:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;34.0.0"
      - name: Build debug APK
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        working-directory: android
        run: |
          ./gradlew lintDebug assembleDebug
          cp build/outputs/apk/debug/*.apk file-converter-android-debug.apk
      - name: Build release APK
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: android
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./gradlew assembleRelease -PapkVersionCode="$GITHUB_RUN_NUMBER" -PapkVersionName="${RELEASE_TAG#v}"
      - name: Sign release APK
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: android
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          : "${KEYSTORE:?Set ANDROID_KEYSTORE_BASE64 for tag builds}"
          umask 077
          key="$RUNNER_TEMP/release.keystore"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$KEYSTORE" | base64 --decode > "$key"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" sign --ks "$key" \
            --ks-key-alias "$KEY_ALIAS" --ks-pass env:STORE_PASSWORD --key-pass env:KEY_PASSWORD \
            --out file-converter-android.apk build/outputs/apk/release/*-unsigned.apk
      - name: Verify APK signature
        working-directory: android
        run: '"$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose file-converter-android*.apk'
      - name: Enable emulator acceleration
        if: github.event_name == 'pull_request'
        run: sudo chmod a+rw /dev/kvm
      - name: Test bundled MP3 encoder and yt-dlp
        if: github.event_name == 'pull_request'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          arch: x86_64
          working-directory: android
          script: ./gradlew connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/file-converter-android*.apk
          if-no-files-found: error

plugins {
    id 'com.android.application' version '8.7.3'
}

android {
    namespace 'org.fileconverter.android'
    compileSdk 35
    defaultConfig {
        applicationId 'org.fileconverter.android'
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        minSdk 26
        targetSdk 35
        versionCode providers.gradleProperty('apkVersionCode').getOrElse('2').toInteger()
        versionName providers.gradleProperty('apkVersionName').getOrElse('0.3.6')
    }
    packaging {
        jniLibs { useLegacyPackaging = true }
    }
    buildTypes {
        debug { applicationIdSuffix '.debug' }
    }
}

dependencies {
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'junit:junit:4.13.2'
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'io.github.junkfood02.youtubedl-android:library:0.18.1'
    implementation 'io.github.junkfood02.youtubedl-android:ffmpeg:0.18.1'
    implementation 'androidx.core:core:1.13.1'
}

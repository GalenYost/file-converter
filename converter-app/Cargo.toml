[package]
name = "converter-app"
version = "0.3.0"
edition = "2024"

[dependencies]
converter-core = { version = "0.3.0", path = "../converter-core" }
directories = "6.0.0"
flate2 = "1.1.10"
iced = { version = "0.14.0", features = ["wgpu", "tokio"] }
rfd = "0.17.2"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tar = "0.4.46"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = "0.3.23"
ureq = { version = "3.4.2", features = ["json"] }
winit = "0.29"
zip = "8.6.0"
